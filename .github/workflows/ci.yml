name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - if: matrix.node == 20
        run: npm run package
      - name: Check changed lines for whitespace errors
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:diff

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify launcher retains its required dev tooling under production omission
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
        run: npm run install:launcher && node -e "require.resolve('concurrently/package.json');if(!require('node:fs').existsSync('node_modules/.bin/concurrently.cmd'))process.exit(1)"
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Check changed lines for whitespace errors
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:diff
